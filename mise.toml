[tools]
node = "24"
npm = "11"

[env]
_.file = ".env"

[tasks.setup]
description = "Installation complète du projet (npm install)"
run = "npm install"

[tasks."setup:dev"]
description = "Setup dev : démarre les services Docker (Postgres) et copie le .env.default en .env"
run = [
  "docker compose -f docker-compose.dev.yml up -d",
  "node scripts/copy-env.mjs",
]

[tasks.migrate]
description = "Génère une migration MikroORM (appliquée au boot par src/server.ts)"
run = "npm run db:migrate"

[tasks.dev]
description = "Lance le panel en mode dev"
run = "npm run dev"

[tasks.test]
depends = ["setup"]
run = "npm test"

[tasks."docker:down"]
run = "docker compose -f docker-compose.dev.yml down"

[tasks."docker:logs"]
run = "docker compose -f docker-compose.dev.yml logs -f"

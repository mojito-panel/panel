[tools]
node = "24"
npm = "11"

[env]
_.file = ".env"

[tasks.setup]
description = "Installation complète du projet (npm install)"
run = "npm install"

[tasks."setup:dev"]
description = "Setup dev : démarre les services Docker (Postgres) et copie les .env.default en .env"
run = [
  "docker compose -f docker-compose.dev.yml up -d",
  "node scripts/copy-env.mjs",
]

[tasks.migrate]
description = "Lance les migrations better-auth (tables user/session/account/verification)"
run = "npm run auth:migrate -w @mojito/panel"

[tasks.dev]
description = "Lance le panel en mode dev"
run = "npm run dev -w @mojito/panel"

[tasks."dev:agent"]
description = "Lance l'agent en mode dev"
run = "npm run dev -w @mojito/agent"

[tasks.test]
depends = ["setup"]
run = "npm test --workspaces --if-present"

[tasks."docker:down"]
run = "docker compose -f docker-compose.dev.yml down"

[tasks."docker:logs"]
run = "docker compose -f docker-compose.dev.yml logs -f"

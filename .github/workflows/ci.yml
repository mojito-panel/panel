# Panel CI — typecheck + full test suite on every push/PR to main.
#
# A Postgres 17 service container backs the database suites (they read
# DATABASE_URL); when the database is unreachable the Postgres suites
# self-skip. The panel validates RECIPES it receives (contract + agent), never
# the recipes repository itself: shipped recipes are validated by the recipes
# repo's own CI.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mojito
          POSTGRES_PASSWORD: mojito
          POSTGRES_DB: mojito
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://mojito:mojito@localhost:5432/mojito

    steps:
      - uses: actions/checkout@v4

      # Node and npm come from mise.toml (pinned versions), not setup-node.
      - uses: jdx/mise-action@v5
        with:
          cache: true

      - name: Install dependencies
        run: npm ci

      # Same steps as the local Git hook (hk.pkl): oxfmt, oxlint, tsc.
      - name: Check (hk)
        run: mise exec -- hk check --all

      - name: Tests
        run: npx vitest run

      # The build needs no database (vite, client + SSR) — it catches
      # import-protection and bundling regressions the tests cannot see.
      - name: Build (client + SSR, no DB needed)
        run: npm run build
